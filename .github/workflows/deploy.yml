name: Deploy

on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Record the currently deployed ref (rollback target)
        id: previous
        run: |
          PREV_REF=$(ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /root/lumio && git rev-parse HEAD')
          echo "ref=$PREV_REF" >> "$GITHUB_OUTPUT"

      - name: Deploy the new release
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
            set -e
            cd /root/lumio
            git fetch --tags origin
            git checkout "${{ github.event.release.tag_name }}"
            (cd backend && npm ci --omit=dev)
            (cd frontend && npm ci && npm run build)
            sudo systemctl restart lumio
          REMOTE

      - name: Health check
        id: health
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.VPS_HOST }}" \
              'curl -fsS http://127.0.0.1:3000/api/health'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Roll back on failed health check
        if: failure() && steps.health.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
            set -e
            cd /root/lumio
            git checkout "${{ steps.previous.outputs.ref }}"
            (cd backend && npm ci --omit=dev)
            (cd frontend && npm ci && npm run build)
            sudo systemctl restart lumio
          REMOTE
          echo "::error::Health check failed after deploy - rolled back to ${{ steps.previous.outputs.ref }}"
          exit 1
