name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Needs a real PAT, not the default GITHUB_TOKEN: a release created
      # with the default token doesn't fire the `release: published` event,
      # which is exactly what deploy.yml waits for. See RELEASE_PLEASE_TOKEN
      # in README's environment/secrets section for how to create it.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
