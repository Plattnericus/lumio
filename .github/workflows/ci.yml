name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/paths-filter calls the PR-files API to compute changes; without
# this it fails with "Resource not accessible by integration" on repos
# where the default token permissions aren't read-write.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      garmin: ${{ steps.filter.outputs.garmin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            garmin:
              - 'garmin-app/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  garmin:
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    runs-on: ubuntu-latest
    # Requires GARMIN_USERNAME/GARMIN_PASSWORD secrets (your own Garmin
    # Connect developer account) - the SDK can't be downloaded without
    # agreeing to Garmin's license as a real account. Until those secrets
    # exist this job will fail at the download step; that's expected, not
    # a sign anything else is broken.
    steps:
      - uses: actions/checkout@v4
      - name: Install connect-iq-sdk-manager
        run: curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
      - name: DEBUG - discover real CLI surface
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          echo "--- agreement --help ---"
          connect-iq-sdk-manager agreement --help
          echo "--- login --help ---"
          connect-iq-sdk-manager login --help
          echo "--- sdk list (no args) ---"
          connect-iq-sdk-manager sdk list || true
      - name: Download SDK and target device
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager sdk agree
          connect-iq-sdk-manager sdk download
          connect-iq-sdk-manager device download --manifest=garmin-app/manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
      - name: Generate a throwaway signing key (compile-check only, never for publishing)
        run: openssl genrsa -out garmin-app/ci_developer_key.pem 4096
      - name: Compile
        working-directory: garmin-app
        run: monkeyc -f monkey.jungle -d vivoactive6 -y ci_developer_key.pem -o /tmp/lumio.prg -w
