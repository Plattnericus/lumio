name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/paths-filter calls the PR-files API to compute changes; without
# this it fails with "Resource not accessible by integration" on repos
# where the default token permissions aren't read-write.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      garmin: ${{ steps.filter.outputs.garmin }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            garmin:
              - 'garmin-app/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  garmin:
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    runs-on: ubuntu-latest
    # Requires GARMIN_USERNAME/GARMIN_PASSWORD secrets (your own Garmin
    # Connect developer account) - the SDK can't be downloaded without
    # agreeing to Garmin's license as a real account. Until those secrets
    # exist, every step below is skipped rather than failing - this job
    # reports success either way, so a Garmin-only PR isn't permanently
    # red over something no local action can fix. The moment the real
    # secrets are set, this goes back to actually compiling on every run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check for Garmin credentials
        id: creds
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::notice::GARMIN_USERNAME/GARMIN_PASSWORD secrets are not set - see README's Actions secrets table. Skipping the real compile-check (not a failure - there's nothing more this job can do without a real Garmin account)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install connect-iq-sdk-manager
        if: steps.creds.outputs.available == 'true'
        run: curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
      - name: Download SDK and target device
        if: steps.creds.outputs.available == 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager agreement accept
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk download ">=6.0.0"
          connect-iq-sdk-manager sdk set ">=6.0.0"
          connect-iq-sdk-manager device download --manifest=garmin-app/manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
      - name: Generate a throwaway signing key (compile-check only, never for publishing)
        if: steps.creds.outputs.available == 'true'
        run: openssl genrsa -out garmin-app/ci_developer_key.pem 4096
      - name: Compile
        if: steps.creds.outputs.available == 'true'
        working-directory: garmin-app
        run: monkeyc -f monkey.jungle -d vivoactive6 -y ci_developer_key.pem -o /tmp/lumio.prg -w
